[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "knowkit-worker"
version = "0.4.0"
description = "Offline staged-file subprocess runtime for KnowKit"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-KnowKit-Private"
dependencies = ["jsonschema==4.26.0", "docling==2.148.0", "torch==2.9.1+cpu", "torchvision==0.24.1+cpu"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[project.scripts]
knowkit-worker = "knowkit_worker.cli:main"

[dependency-groups]
dev = ["packaging==26.3", "pytest==9.1.1", "reportlab==4.4.10"]

[tool.pytest.ini_options]
testpaths = ["tests/protocol"]
addopts = "--strict-markers"
junit_family = "xunit2"

[tool.hatch.build.targets.wheel]
packages = ["src/knowkit_worker"]
